[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solar-hub"
version = "0.1.0"
description = "Plataforma Open Source e soberana de telemetria, diagnóstico e inteligência para usinas solares APsystems com gestão estrita de cota."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Comunidade Open Source" }
]
keywords = ["solar", "apsystems", "photovoltaic", "energy-monitoring", "smart-home", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "paho-mqtt>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
solar = "solar_hub.interfaces.cli.main:app"
solar-hub = "solar_hub.interfaces.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_hub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
